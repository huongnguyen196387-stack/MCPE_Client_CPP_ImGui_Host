name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.7'
  ANDROID_NDK_VERSION: '27.2.12479018'
  CMAKE_VERSION: '3.22.1'
  BUILD_TOOLS_VERSION: '35.0.0'
  ANDROID_PLATFORM: 'android-35'

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK / NDK / CMake
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Set Android environment
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          "$ANDROID_HOME/cmake/${CMAKE_VERSION}/bin/cmake" --version
          test -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          test -d "$ANDROID_HOME/platforms/${ANDROID_PLATFORM}"
          test -d "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}"

      - name: Install Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          mkdir -p "$RUNNER_TEMP/gradle"
          unzip -q /tmp/gradle.zip -d "$RUNNER_TEMP/gradle"
          echo "$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle/gradle-${GRADLE_VERSION}/bin/gradle" --version

      - name: Create local.properties
        shell: bash
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: List generated APKs
        shell: bash
        run: |
          set -euo pipefail
          find app/build/outputs/apk -type f -name '*.apk' -print -exec ls -lh {} \;

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MCPE-Client-CPP-ImGui-Host-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
